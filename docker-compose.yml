services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturacion_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dbfacturacion}
      DB_USER: ${DB_USER:-facturacion_app}
      DB_PASSWORD: ${DB_PASSWORD:-facturacion_app_dev}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - facturacion_net

  db:
    image: mariadb:10.6
    container_name: facturacion_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-dbfacturacion}
      # MPR-001: usuario de la aplicacion con permisos minimos
      DB_APP_USER: ${DB_USER:-facturacion_app}
      DB_APP_PASSWORD: ${DB_PASSWORD:-facturacion_app_dev}
    volumes:
      - db_data:/var/lib/mysql
      - ./BD/bdsistema.sql:/docker-entrypoint-initdb.d/01_bdsistema.sql:ro
      - ./docker/db/02_usuario_app.sh:/docker-entrypoint-initdb.d/02_usuario_app.sh:ro
      - ./BD/migraciones/001_stock_minimo.sql:/docker-entrypoint-initdb.d/03_stock_minimo.sql:ro
      - ./BD/migraciones/002_abonos_cuotas.sql:/docker-entrypoint-initdb.d/04_abonos_cuotas.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - facturacion_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: facturacion_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - facturacion_net

volumes:
  db_data:

networks:
  facturacion_net:
    driver: bridge
