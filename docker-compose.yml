services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facturacion_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dbfacturacion}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      facturacion_net:
        aliases:
          - app.local

  db:
    image: mariadb:10.6
    container_name: facturacion_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-dbfacturacion}
    volumes:
      - db_data:/var/lib/mysql
      - ./BD/bdsistema.sql:/docker-entrypoint-initdb.d/01_bdsistema.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - facturacion_net

  # Suite de regresion E2E (Playwright). Se ejecuta solo con el perfil "test":
  #   docker compose --profile test run --rm e2e
  #   docker compose --profile test run --rm e2e sh -c "npm ci --no-audit --no-fund && npx playwright test --grep @critico"
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    container_name: facturacion_e2e
    profiles:
      - test
    working_dir: /repo/e2e
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    environment:
      BASE_URL: http://app.local
      CI: "true"
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    volumes:
      - .:/repo
    depends_on:
      app:
        condition: service_started
    networks:
      - facturacion_net
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: facturacion_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - facturacion_net

volumes:
  db_data:

networks:
  facturacion_net:
    driver: bridge
